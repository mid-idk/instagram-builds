name: Get Instagram APK
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download from Drifty Winds
        run: |
          # Скачиваем стабильный APK релиз через API GitHub
          curl -s https://github.com | grep "browser_download_url" | head -n 1 | cut -d '"' -f 4 | xargs curl -L -o instagram_piko.apk

      - name: Save Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Instagram-Build
          path: instagram_piko.apk
          
